<header class="top">
  <a class="brand" routerLink="/">
    <img src="favicon.svg" width="32" height="32" alt="" />
    <span>
      <strong>jEarth</strong>
      <small>Junction</small>
    </span>
  </a>
  <nav>
    <a routerLink="/" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }">{{
      'nav.earth' | t
    }}</a>
    <a routerLink="/style" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }">{{
      'nav.style' | t
    }}</a>
    <a routerLink="/guide" routerLinkActive="on">{{ 'nav.guide' | t }}</a>
    <a routerLink="/sort" routerLinkActive="on">{{ 'nav.sort' | t }}</a>
    <a routerLink="/heroes" routerLinkActive="on">{{ 'nav.heroes' | t }}</a>
    <a routerLink="/nearby" routerLinkActive="on">{{ 'nav.nearby' | t }}</a>
    <a routerLink="/mushrooms" routerLinkActive="on">{{ 'nav.mushrooms' | t }}</a>
  </nav>
  <div class="header-end">
    <div class="lang-toggle" role="group" [attr.aria-label]="'lang.group' | t">
      <button type="button" [class.active]="i18n.lang() === 'hi'" (click)="i18n.setLang('hi')">
        {{ 'lang.hi' | t }}
      </button>
      <button type="button" [class.active]="i18n.lang() === 'en'" (click)="i18n.setLang('en')">
        {{ 'lang.en' | t }}
      </button>
    </div>
    <a class="today" href="https://junction.today" target="_blank" rel="noreferrer">{{
      'nav.today' | t
    }}</a>
  </div>
</header>
<main [class.main--style]="styleBookOpen()">
  <router-outlet />
</main>
@if (!styleBookOpen()) {
  <footer class="foot">
    <p>{{ 'footer.blurb' | t }}</p>
    <p class="copyright">© {{ year }} Sunskriti Data Management Company</p>
  </footer>
}
